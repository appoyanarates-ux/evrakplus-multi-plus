<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yazdır — DersMatrix Ultimate</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font:14px/1.45 "Segoe UI",Inter,system-ui,-apple-system,sans-serif;color:#1f2328;background:#e8eaed}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 336px;height:100vh}
  .prev{display:flex;flex-direction:column;min-width:0;height:100%;background:#dfe3e8;position:relative}
  .prev-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:#f4f6f8;border-bottom:1px solid #d4d8de;font-size:12.5px;color:#4b5563}
  .prev-bar b{color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44ch}
  .zoom-grp{display:inline-flex;align-items:center;gap:4px}
  .zbtn{min-width:28px;height:28px;padding:0 8px;border:1px solid #cfd4dc;border-radius:7px;background:#fff;color:#1f2328;cursor:pointer;font-weight:600;font-size:12.5px}
  .zbtn:hover{background:#eef2f7;border-color:#9aa3b0}
  .prev-body{flex:1;overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start}
  .frame-wrap{flex:none;background:#fff;box-shadow:0 4px 22px rgba(0,0,0,.18);border-radius:3px}
  #pageHost{display:block;background:#fff;min-height:420px}

  .panel{display:flex;flex-direction:column;height:100%;background:#fff;border-left:1px solid #dadce0}
  .p-head{display:flex;align-items:baseline;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid #eef0f3}
  .p-head h1{margin:0;font-size:18px;font-weight:600;color:#111827}
  .p-head span{font-size:13px;color:#5f6368;font-weight:500}
  .p-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
  .fld{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;align-items:center}
  .fld label{font-size:13px;color:#3c4043;font-weight:500}
  .fld select,.fld input[type=number]{width:100%;height:36px;padding:0 10px;border:1px solid #cfd4dc;border-radius:8px;background:#fff;color:#1f2328;font:inherit;font-size:13.5px}
  .fld select:focus,.fld input:focus{outline:2px solid #1a56db;outline-offset:1px;border-color:#1a56db}
  .more-box{border-top:1px solid #eef0f3;padding-top:12px;margin-top:2px}
  .more-btn{background:none;border:0;padding:4px 0;color:#1a56db;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .more-btn:hover{text-decoration:underline}
  .more-body{display:none;flex-direction:column;gap:10px;margin-top:10px}
  .more-body.open{display:flex}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;color:#3c4043;cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:#1a56db;cursor:pointer}
  .sys-btn{width:100%;height:34px;border:1px solid #cfd4dc;border-radius:8px;background:#f8f9fa;color:#1f2328;font-size:12.5px;font-weight:600;cursor:pointer}
  .sys-btn:hover{background:#eef2f7;border-color:#9aa3b0}
  .status{font-size:12.5px;padding:8px 10px;border-radius:8px;display:none}
  .status.info{display:block;background:#eff6ff;color:#1d4ed8}
  .status.err{display:block;background:#fde7e9;color:#c01f2b}

  .p-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid #eef0f3;background:#fff}
  .btn{height:38px;padding:0 20px;border-radius:99px;border:1px solid #cfd4dc;background:#fff;color:#1a56db;font-weight:600;font-size:13.5px;cursor:pointer}
  .btn:hover{background:#f3f6fc}
  .btn.pri{background:#1a56db;border-color:#1a56db;color:#fff;min-width:96px}
  .btn.pri:hover{background:#1648bd}
  .btn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
  <section class="prev">
    <div class="prev-bar">
      <b id="docTitle">Belge Önizleme</b>
      <div class="zoom-grp">
        <button class="zbtn" id="zOut" title="Küçült">−</button>
        <span id="zLbl" style="min-width:44px;text-align:center;font-weight:600">85%</span>
        <button class="zbtn" id="zIn" title="Büyüt">+</button>
        <button class="zbtn" id="zFit" title="Pencereye sığdır">Sığdır</button>
      </div>
    </div>
    <div class="prev-body" id="prevBody">
      <div class="frame-wrap" id="frameWrap">
        <div id="pageHost" aria-label="Yazdırma önizlemesi"></div>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="p-head">
      <h1>Yazdır</h1>
      <span id="pageCount">1 sayfa</span>
    </div>

    <div class="p-body">
      <div class="fld">
        <label for="selDest">Hedef</label>
        <select id="selDest"></select>
      </div>

      <div class="fld" id="rowCopies">
        <label for="inpCopies">Kopya</label>
        <input id="inpCopies" type="number" min="1" max="99" value="1">
      </div>

      <div class="fld">
        <label for="selOrient">Düzen</label>
        <select id="selOrient">
          <option value="portrait">Dikey</option>
          <option value="landscape">Yatay</option>
        </select>
      </div>

      <div class="fld">
        <label for="selPaper">Kağıt boyutu</label>
        <select id="selPaper">
          <option value="A4">A4</option>
          <option value="A3">A3 (Geniş Çarşaf)</option>
        </select>
      </div>

      <div class="fld" id="rowColor">
        <label for="selColor">Renk</label>
        <select id="selColor">
          <option value="color">Renkli</option>
          <option value="bw">Siyah-Beyaz</option>
        </select>
      </div>

      <div class="more-box">
        <button type="button" class="more-btn" id="btnMore">Daha fazla ayar ▾</button>
        <div class="more-body" id="moreBody">
          <label class="chk"><input type="checkbox" id="chkBg" checked> Arka plan grafikleri ve renkler</label>
          <button type="button" class="sys-btn" id="btnSysDlg">Sistem yazıcı penceresi ile yazdır…</button>
        </div>
      </div>

      <div class="status" id="statusBox"></div>
    </div>

    <div class="p-foot">
      <button type="button" class="btn pri" id="btnPrint">Yazdır</button>
      <button type="button" class="btn" id="btnCancel">İptal</button>
    </div>
  </aside>
</div>

<script>
(async () => {
  const api = window.printPreviewApi;
  const selDest = document.getElementById('selDest');
  const inpCopies = document.getElementById('inpCopies');
  const rowCopies = document.getElementById('rowCopies');
  const rowColor = document.getElementById('rowColor');
  const selOrient = document.getElementById('selOrient');
  const selPaper = document.getElementById('selPaper');
  const selColor = document.getElementById('selColor');
  const chkBg = document.getElementById('chkBg');
  const btnMore = document.getElementById('btnMore');
  const moreBody = document.getElementById('moreBody');
  const btnSysDlg = document.getElementById('btnSysDlg');
  const btnPrint = document.getElementById('btnPrint');
  const btnCancel = document.getElementById('btnCancel');
  const statusBox = document.getElementById('statusBox');
  const pageHost = document.getElementById('pageHost');
  const shadow = pageHost.attachShadow({ mode: 'open' });
  const frameWrap = document.getElementById('frameWrap');
  const prevBody = document.getElementById('prevBody');
  const pageCountEl = document.getElementById('pageCount');
  const docTitleEl = document.getElementById('docTitle');
  const zLbl = document.getElementById('zLbl');

  let job = null;
  let zoom = 0.85;
  let busy = false;

  function setStatus(kind, msg) {
    statusBox.className = 'status' + (kind ? ' ' + kind : '');
    statusBox.textContent = msg || '';
  }

  function applyZoom(val) {
    zoom = Math.max(0.4, Math.min(1.5, val));
    zLbl.textContent = Math.round(zoom * 100) + '%';
    frameWrap.style.zoom = String(zoom);
  }

  function fitPreview() {
    const isLand = selOrient.value === 'landscape';
    const isA3 = selPaper.value === 'A3';
    const baseW = isLand ? (isA3 ? 1320 : 1123) : (isA3 ? 980 : 794);
    pageHost.style.width = baseW + 'px';
    const avail = Math.max(320, prevBody.clientWidth - 48);
    applyZoom(Math.min(1, avail / baseW));
  }

  function updatePreviewFrame() {
    if (!job) return;
    const isLand = selOrient.value === 'landscape';
    const isA3 = selPaper.value === 'A3';
    const baseW = isLand ? (isA3 ? 1320 : 1123) : (isA3 ? 980 : 794);
    const bwCss = selColor.value === 'bw' ? ':host{filter:grayscale(100%)}' : '';
    const parser = new DOMParser();
    const parsed = parser.parseFromString(job.html, 'text/html');
    const styles = Array.from(parsed.querySelectorAll('style')).map(s => s.textContent || '').join('\n');
    const bodyHtml = parsed.body ? parsed.body.innerHTML : job.html;
    const prevCss = `${styles}\n${bwCss}\n:host{display:block;background:#fff;color:#000;padding:18px 22px;box-sizing:border-box}.doc{width:100%!important;min-height:auto!important;margin:0 0 22px!important;padding:12px 14px!important;box-shadow:none!important;border-bottom:1px dashed #d0d7de}.doc:last-child{border-bottom:0;margin-bottom:0!important}`;
    shadow.innerHTML = `<style>${prevCss}</style>${bodyHtml}`;
    const pages = Math.max(1, shadow.querySelectorAll('section.doc').length);
    pageCountEl.textContent = pages + ' sayfa';
    pageHost.style.width = baseW + 'px';
    fitPreview();
  }

  function syncDestUi() {
    const isPdf = selDest.value === '__PDF__';
    btnPrint.textContent = isPdf ? 'Kaydet' : 'Yazdır';
    rowCopies.style.display = isPdf ? 'none' : 'grid';
    rowColor.style.display = isPdf ? 'none' : 'grid';
    btnSysDlg.style.display = isPdf ? 'none' : 'block';
  }

  job = await api.getJob();
  if (!job) {
    setStatus('err', 'Yazdırma verisi yüklenemedi.');
    return;
  }

  docTitleEl.textContent = job.title || 'Belge Önizleme';
  selOrient.value = job.landscape ? 'landscape' : 'portrait';
  selPaper.value = job.paperSize === 'A3' ? 'A3' : 'A4';

  const printers = Array.isArray(job.printers) ? job.printers : [];
  const opts = [];
  for (const p of printers) {
    const lbl = (p.displayName || p.name) + (p.isDefault ? ' (Varsayılan)' : '');
    opts.push({ value: p.name, label: lbl, isDefault: Boolean(p.isDefault) });
  }
  opts.push({ value: '__PDF__', label: 'PDF olarak kaydet', isDefault: false });
  selDest.innerHTML = opts.map(o => `<option value="${o.value.replace(/"/g, '&quot;')}">${o.label.replace(/</g, '&lt;')}</option>`).join('');
  const def = opts.find(o => o.isDefault) || opts[0];
  if (def) selDest.value = def.value;
  syncDestUi();
  updatePreviewFrame();

  selDest.addEventListener('change', syncDestUi);
  selOrient.addEventListener('change', updatePreviewFrame);
  selPaper.addEventListener('change', updatePreviewFrame);
  selColor.addEventListener('change', updatePreviewFrame);
  btnMore.addEventListener('click', () => {
    const open = moreBody.classList.toggle('open');
    btnMore.textContent = open ? 'Daha az ayar ▴' : 'Daha fazla ayar ▾';
  });
  document.getElementById('zOut').addEventListener('click', () => applyZoom(zoom - 0.1));
  document.getElementById('zIn').addEventListener('click', () => applyZoom(zoom + 0.1));
  document.getElementById('zFit').addEventListener('click', fitPreview);
  window.addEventListener('resize', fitPreview);

  async function doPrint(useSystemDialog) {
    if (busy) return;
    busy = true;
    btnPrint.disabled = true;
    btnSysDlg.disabled = true;
    setStatus('info', selDest.value === '__PDF__' ? 'PDF hazırlanıyor…' : 'Yazıcıya gönderiliyor…');
    try {
      const res = await api.execute({
        deviceName: selDest.value,
        copies: Math.max(1, Math.min(99, parseInt(inpCopies.value, 10) || 1)),
        landscape: selOrient.value === 'landscape',
        paperSize: selPaper.value === 'A3' ? 'A3' : 'A4',
        color: selColor.value !== 'bw',
        printBackground: chkBg.checked,
        useSystemDialog: Boolean(useSystemDialog)
      });
      if (res && !res.ok && !res.canceled) {
        setStatus('err', res.error || 'Yazdırma tamamlanamadı.');
        busy = false;
        btnPrint.disabled = false;
        btnSysDlg.disabled = false;
      }
    } catch (err) {
      setStatus('err', err && err.message ? err.message : String(err));
      busy = false;
      btnPrint.disabled = false;
      btnSysDlg.disabled = false;
    }
  }

  btnPrint.addEventListener('click', () => doPrint(false));
  btnSysDlg.addEventListener('click', () => doPrint(true));
  btnCancel.addEventListener('click', () => api.cancel());
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') api.cancel();
    else if (e.key === 'Enter' && document.activeElement?.tagName !== 'BUTTON') doPrint(false);
  });
})();
</script>
</body>
</html>
