<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14171c">
  <title>EvrakPlus Ders Dağıtım Multi Plus · v1.0.0</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <svg class="logo" viewBox="0 0 34 34" aria-hidden="true">
          <rect x="1" y="1" width="32" height="32" rx="9" fill="#d42a38"/>
          <g fill="#fff">
            <rect x="7" y="8" width="6" height="5" rx="1.5"/>
            <rect x="14" y="8" width="6" height="5" rx="1.5" opacity=".55"/>
            <rect x="21" y="8" width="6" height="5" rx="1.5"/>
            <rect x="7" y="15" width="6" height="5" rx="1.5" opacity=".55"/>
            <rect x="14" y="15" width="13" height="5" rx="1.5"/>
            <rect x="7" y="22" width="13" height="5" rx="1.5"/>
            <rect x="21" y="22" width="6" height="5" rx="1.5" opacity=".55"/>
          </g>
        </svg>
        <div>
          <b>EvrakPlus Multi Plus</b>
          <small>v1.0.0 · Ders Dağıtım Programı</small>
        </div>
      </div>
      <nav class="menu" id="sideMenu" aria-label="Ana menü"></nav>
      <div class="sidefoot">
        Veriler yerel olarak otomatik saklanır. Kalıcı yedek için <b>JSON Yedek</b> indirin.<br>
        <a href="https://www.evrakplus.com/" target="_blank" rel="noopener" style="color:inherit">evrakplus.com</a>
      </div>
    </aside>

    <div class="main">
      <div id="banner"></div>
      <header class="top">
        <span class="nm" id="topSchoolName">EvrakPlus Ders Dağıtım Multi Plus</span>
        <span class="pill" id="topStatus">Hazır</span>
        <span class="pill" id="topRuntime">Tarayıcı Modu</span>
        <span class="sp"></span>
        <button class="btn sm ghost" data-act="undo" id="bUndo" title="Geri al (Ctrl+Z)">Geri al</button>
        <button class="btn sm ghost" data-act="redo" id="bRedo" title="Yinele (Ctrl+Y)">Yinele</button>
        <button class="btn sm" id="btnInstallPwa" style="display:none">Uygulamayı Yükle</button>
        <button class="btn sm" data-act="saveJson">JSON Yedek</button>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>

  <nav class="mob-nav" id="mobNav" aria-label="Mobil hızlı menü">
    <button data-nav="dashboard">Panel</button>
    <button data-nav="auto_schedule">Dağıtım</button>
    <button data-nav="timetables">Program</button>
    <button data-nav="reports">Çıktı</button>
    <button data-nav="backup_sync">Yedek</button>
  </nav>

  <div id="modalRoot"></div>
  <script src="./meb-data.js"></script>
  <script src="./solver-bridge.js"></script>
  <script src="./reports-doc.js"></script>
  <script src="./app.js"></script>
</body>
</html>
